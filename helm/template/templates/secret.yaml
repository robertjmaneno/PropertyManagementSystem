apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    {{- include "go-clean-template.labels" . | nindent 4 }}
type: Opaque
data:
  postgresql-password: {{ .Values.postgresql.auth.password | default (randAlphaNum 16) | b64enc | quote }}
  redis-password: {{ .Values.redis.auth.password | default (randAlphaNum 16) | b64enc | quote }}
  jwt-secret: {{ .Values.config.auth.jwtSecret | default (randAlphaNum 32) | b64enc | quote }} 